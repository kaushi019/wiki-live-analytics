version: '3.8'

services:
  # 🐘 PostgreSQL Database Storage
  wiki-db:
    image: postgres:16-alpine
    container_name: wiki-postgres-container
    environment:
      POSTGRES_DB: wiki_stream_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wiki_live_pass_019
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - wiki-network

  # 🐒 Zookeeper Cluster Coordinator
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: wiki-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - wiki-network

  # 📦 Apache Kafka Distributed Message Broker Queue
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: wiki-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 💥 FIXED: Using standard PLAINTEXT naming keys so the Python client can resolve them instantly
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - wiki-network

  # 🚀 The Entire Python App Stack (Consumer + Producer + Dashboard)
  wiki-pipeline-app:
    build: .
    container_name: wiki-python-stack-container
    depends_on:
      - wiki-db
      - kafka
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=wiki-db
      - DB_PORT=5432
      - DB_NAME=wiki_stream_db
      - DB_USER=postgres
      - DB_PASSWORD=wiki_live_pass_019
      - KAFKA_BROKER=kafka:29092
    volumes:
      - .:/app
    command: python run_cluster.py
    networks:
      - wiki-network
    restart: unless-stopped

networks:
  wiki-network:
    driver: bridge

volumes:
  postgres_data:
